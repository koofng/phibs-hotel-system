# Render Blueprint: one web service (API + website) and a PostgreSQL database,
# both in Frankfurt. See DEPLOY.md for the step-by-step guide.
databases:
  - name: phibs-hotel-db
    region: frankfurt
    plan: basic-256mb
    databaseName: hotel
    user: hotel

services:
  - type: web
    name: phibs-hotel
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: phibs-hotel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      # Used once, to create the first admin login on the empty database.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
